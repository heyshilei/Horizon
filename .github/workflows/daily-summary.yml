name: Daily Horizon Summary

on:
  schedule:
    - cron: '0 23 * * *' # 每天北京时间 07:00 自动运行
    - cron: '0 11 * * *' # 每天北京时间 19:00 自动运行
  workflow_dispatch:     # 支持随时手动点击运行

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 允许将生成的日报写回仓库

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon Radar with config.github.json
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp data/config.github.json data/config.json
          uv run horizon -c data/config.github.json --hours 24

      - name: Commit and Push generated docs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/summaries/
          git diff --staged --quiet || git commit -m "chore: update Horizon daily briefing $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
