name: Daily Horizon Summary

on:
  schedule:
    # 北京时间 07:50 (UTC 23:50) 与 17:50 (UTC 09:50) 自动运行
    - cron: '50 23 * * *'
    - cron: '50 9 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore official scoring engine (fix 5.0 score bug)
        run: |
          git remote add upstream https://github.com/Thysrael/Horizon.git || true
          git fetch upstream main
          git checkout upstream/main -- src/ profiles/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon Radar with config.github.json
        env:
          TZ: Asia/Shanghai
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: uv run horizon -c data/config.github.json

      - name: Commit and Push generated docs to main
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- src/ profiles/
          git add -f docs/_posts/ docs/ data/summaries/
          git diff --staged --quiet || (git commit -m "chore: update daily summary $(date +'%Y-%m-%d %H:%M')" && git push origin main)
